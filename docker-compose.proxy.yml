# Апдейкон за внешним обратным прокси (Nginx Proxy Manager, nginx, Traefik…):
# своего Caddy нет, порты 80/443 остаются прокси. Выбирается в deploy.sh
# (вариант 2), который пишет в .env:
#   COMPOSE_FILE=docker-compose.proxy.yml   — docker compose сам берёт этот файл
#   PROXY_NETWORK=<сеть прокси>             — прокси в Docker: веб в его сети как updatecon:3000
#   WEB_PORT=3000                           — прокси на хосте: http://127.0.0.1:3000
# HTTPS и домен настраиваются в прокси; админка это знает (CADDY_API=off).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-upd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-upd}
      POSTGRES_DB: ${POSTGRES_DB:-upd}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-upd}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  web:
    image: ghcr.io/imironru/updatecon:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-upd}:${POSTGRES_PASSWORD:-upd}@db:5432/${POSTGRES_DB:-upd}
      PORT: 3000
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      ITS_LOGIN: ${ITS_LOGIN:-}
      ITS_PASSWORD: ${ITS_PASSWORD:-}
      CADDY_API: "off"
      AUTO_UPDATE: ${AUTO_UPDATE:-0}
    # Only for a proxy on this host; not reachable from outside.
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      default: {}
      proxy:
        aliases: [updatecon]
    command: ["node", "dist/db/server.js"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  worker:
    image: ghcr.io/imironru/updatecon:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-upd}:${POSTGRES_PASSWORD:-upd}@db:5432/${POSTGRES_DB:-upd}
      ITS_LOGIN: ${ITS_LOGIN:-}
      ITS_PASSWORD: ${ITS_PASSWORD:-}
      LST_FILE: ${LST_FILE:-}
      IMPORT_CRON: ${IMPORT_CRON:-0 4 * * *}
      IMPORT_ON_START: ${IMPORT_ON_START:-1}
    volumes:
      - ${LST_HOST_DIR:-./data}:/data:ro
    command: ["node", "dist/db/worker.js"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

volumes:
  pgdata:

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-updatecon-proxy}
